[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadgen"
version = "1.0.0"
description = "Multi-source freelance lead-generation pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.30",
    "requests>=2.31",
    "tenacity>=8.3",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "ddgs>=9.0",
    "tavily-python>=0.5",
    "apify-client>=1.7",
    "praw>=7.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
leadgen-run = "leadgen.run_pipeline_cli:main"
leadgen-report = "leadgen.generate_report_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

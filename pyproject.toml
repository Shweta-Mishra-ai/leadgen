[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadgen"
version = "1.0.0"
description = "Multi-source freelance lead-generation pipeline"
requires-python = ">=3.11"
# Upper bounds are deliberate. Unbounded ranges silently pulled
# apify-client 3.x (breaking dict->object API, which killed the Twitter
# source) and pandas 3.x into CI. Bump these on purpose, not by surprise.
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "openai>=1.30,<3",
    "requests>=2.31,<3",
    "tenacity>=8.3,<10",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "ddgs>=9.0,<10",
    "tavily-python>=0.5,<1",
    "apify-client>=1.7,<4",
    "praw>=7.7,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<7",
    # Ruff's lint rules change between minor versions (RUF100 flagging this
    # exact noqa is what broke CI here) — pin so "passes locally" reliably
    # means "passes in CI" instead of depending on whichever ruff you
    # happen to have installed.
    "ruff==0.16.2",
]

[project.scripts]
leadgen-run = "leadgen.run_pipeline_cli:main"
leadgen-report = "leadgen.generate_report_cli:main"
leadgen-bot = "leadgen.telegram_bot_cli:main"
leadgen-outreach = "leadgen.direct_outreach_cli:main"
leadgen-test-email = "leadgen.test_email_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

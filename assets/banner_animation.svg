<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Grid / Network Lines -->
  <path d="M0,100 L1200,100 M0,200 L1200,200 M0,300 L1200,300" stroke="url(#line-grad)" stroke-width="1" />
  <path d="M200,0 L200,400 M400,0 L400,400 M600,0 L600,400 M800,0 L800,400 M1000,0 L1000,400" stroke="url(#line-grad)" stroke-width="1" />

  <!-- Glowing Nodes with Animation -->
  <g filter="url(#glow)">
    <circle cx="200" cy="100" r="6" fill="#38BDF8">
      <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="200" r="8" fill="#818CF8">
      <animate attributeName="r" values="6;10;6" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="100" r="6" fill="#C084FC">
      <animate attributeName="r" values="4;8;4" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="300" r="7" fill="#38BDF8">
      <animate attributeName="r" values="5;9;5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="800" cy="300" r="7" fill="#C084FC">
      <animate attributeName="r" values="5;9;5" dur="3.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Connecting Pulses -->
  <path d="M200,100 Q400,50 600,200 T1000,100" stroke="#818CF8" stroke-width="2" fill="none" stroke-dasharray="10,15">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="5s" repeatCount="indefinite" />
  </path>
  <path d="M400,300 Q600,350 800,300" stroke="#38BDF8" stroke-width="2" fill="none" stroke-dasharray="8,12">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- Center Typography -->
  <text x="600" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="url(#text-grad)" filter="url(#glow)">
    LEADGEN AUTOMATION
  </text>
  
  <text x="600" y="225" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#94A3B8" letter-spacing="3">
    MULTI-SOURCE CLIENT ACQUISITION &amp; TELEGRAM BOT
  </text>

  <!-- Feature Badges inside SVG -->
  <g transform="translate(320, 270)">
    <rect x="0" y="0" width="160" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="80" y="23" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38BDF8">⚡ AUTOMATION</text>
    
    <rect x="180" y="0" width="140" height="36" rx="18" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" />
    <text x="250" y="23" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#818CF8">✍️ WRITING</text>
    
    <rect x="340" y="0" width="140" height="36" rx="18" fill="#1E293B" stroke="#C084FC" stroke-width="1.5" />
    <text x="410" y="23" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#C084FC">📊 DATA &amp; AI</text>
  </g>
</svg>
